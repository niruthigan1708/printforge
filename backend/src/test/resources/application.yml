spring:
  datasource:
    url: jdbc:h2:mem:printforge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
app:
  seed:
    enabled: false
  upload-dir: target/test-uploads/custom-prints
JWT_SECRET: test-secret-key-at-least-32-characters-long

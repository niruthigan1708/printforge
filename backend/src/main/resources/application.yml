spring:
  application:
    name: printforge-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printforge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 22MB
app:
  upload-dir: ${UPLOAD_DIR:uploads/custom-prints}
  product-image-dir: ${PRODUCT_IMAGE_DIR:uploads/products}

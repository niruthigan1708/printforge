spring:
  application:
    name: printforge-api
  # Load KEY=VALUE pairs from backend/.env (when present) so `mvn spring-boot:run` picks up
  # local secrets without exporting them into the shell. Real environment variables still win.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:printforge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # The schema is owned by Flyway migrations; Hibernate only checks that it matches the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Databases created before Flyway was adopted already have the V1 schema: record them as
    # version 1 instead of failing, then apply later migrations as usual.
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: 8080
spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 22MB
app:
  # Demo accounts/products for local development. Off unless SEED_DEMO_DATA=true; never enable it
  # in a real deployment (the demo passwords are published in the README).
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  upload-dir: ${UPLOAD_DIR:uploads/custom-prints}
  product-image-dir: ${PRODUCT_IMAGE_DIR:uploads/products}
  # Flat delivery fee per order (Rs.). The single source of truth: the shop reads it from
  # GET /api/shop/settings instead of hardcoding its own copy.
  delivery-fee: ${DELIVERY_FEE:350}
  # Orders with a subtotal at or above this get free delivery. Set to 0 to switch it off.
  free-delivery-threshold: ${FREE_DELIVERY_THRESHOLD:5000}
  # Login throttling: failures allowed per account / per IP within the window before lockout.
  auth:
    max-failed-logins-per-account: ${MAX_FAILED_LOGINS_PER_ACCOUNT:5}
    max-failed-logins-per-ip: ${MAX_FAILED_LOGINS_PER_IP:20}
    lockout-window: ${LOGIN_LOCKOUT_WINDOW:15m}
  # Comma-separated origins allowed to call the API from a browser.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
